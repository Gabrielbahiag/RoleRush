# Dicionário de skills canônicas + sinônimos/grafias.
#
# Usado por dois caminhos (ver CURRICULO.md §5.2):
#   1. extração de requisitos da vaga no modo sem IA;
#   2. guardrail anti-invenção — decide se uma tecnologia citada num bullet
#      reescrito existe mesmo no currículo-mestre.
#
# Regra: um mesmo termo não pode aparecer em duas skills (a carga falha).
# Não repita a forma canônica dentro de "sinonimos" — ela já é reconhecida.

skills:
  # --- linguagens ---
  - canonica: Python
    categoria: linguagem
    sinonimos: [python3, py]
  - canonica: JavaScript
    categoria: linguagem
    sinonimos: [js, ecmascript]
  - canonica: TypeScript
    categoria: linguagem
    sinonimos: [ts]
  - canonica: Java
    categoria: linguagem
  - canonica: Go
    categoria: linguagem
    sinonimos: [golang]
  - canonica: SQL
    categoria: linguagem

  # --- bancos de dados ---
