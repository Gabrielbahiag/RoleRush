# Todos os termos são comparados sem acento, sem maiúsculas e sem HTML
# ("brasilia" casa "Brasília"). Termo terminado em * casa qualquer
# continuação: "desenvolvedor*" pega desenvolvedora e desenvolvedores.
filtros:
  palavras_chave: # bate no título + descrição; passa se achar QUALQUER um
    - python
    - machine learning
    - inteligencia artificial
    - llm
    - prompt engineering
    - engenharia de prompt
    - engenharia de software
    - engenheiro de software
    - engenheira de software
    - software engineer* # engineer, engineers, engineering
    - desenvolvedor* # desenvolvedora, desenvolvedores
  excluir: [] # descarta se aparecer (ex: "senior" caso volte a filtrar por nível)
  senioridade: [] # vazio = qualquer nível (júnior, pleno, sênior)
  remoto: null # não exige remoto: o filtro de localização já libera remotas
  localizacao: # presencial/híbrida só passa se bater aqui
    - brasilia
    - df
    - distrito federal
    - taguatinga
    - aguas claras
  # remota com restrição de país ("USA", "Remote - Germany") só passa se a
  # restrição bater aqui (ou em `localizacao`); remota sem restrição passa.
  remoto_aceito:
    - brasil
    - brazil
    - latam
    - latin america
    - south america
    - americas
    - worldwide
    - anywhere
    - global

fontes:
  remotive:
    ativo: true
    categoria: software-development
  github_repo:
    ativo: true
    repos:
      - backend-br/vagas
      - frontend-pt/vagas
      - frontendbr/vagas
      - datascience-br/vagas
  adzuna:
    ativo: true
    pais: br
    where: Brasília # a API tem localização de verdade; complementa o filtro acima
    what: null # deixado em branco de propósito: o filtro de palavras-chave já filtra
    paginas: 3 # até 150 vagas por execução, mais novas primeiro
    max_dias: 3 # ignora vagas publicadas há mais de 3 dias
  remoteok:
    ativo: true
  arbeitnow:
    ativo: true
  himalayas:
    ativo: true
    country: Brazil # filtro real da API; a palavra-chave ainda passa por cima
    q: null
  jobicy:
    ativo: true # agregador de vagas remotas, sem credencial
    geo: brazil # só vagas abertas a quem mora no Brasil (inclui LATAM e "Anywhere")
    tag: null
  themuse:
    ativo: true
    categoria: null
    localizacao: null
  greenhouse:
    ativo: false # ative e preencha "empresas" com os boards que quiser acompanhar
    empresas: [] # ex: [airbnb, stripe] — o slug é o mesmo da URL da vaga
  lever:
    ativo: false
    empresas: [] # ex: [netlify] — só funciona pra empresas que usam Lever
  ashby:
    ativo: false
    empresas: [] # ex: [ashby] — só funciona pra empresas que usam Ashby

notificacao:
  telegram: true
  max_por_execucao: 150 # o excedente fica para a próxima execução (não é perdido)
  agrupar_acima: 10 # mais de 10 vagas de uma vez: várias por mensagem
  vagas_por_mensagem: 8

# quantos dias manter uma vaga no histórico de dedup (vagas_vistas) antes de
# podar; null = manter pra sempre. Uma vaga podada volta a ser tratada como
# nova se a fonte ainda a retornar — aceitável pra manter o vagas.db pequeno.
retencao_dias: 90

curriculo:
  mestre: curriculo_mestre.yaml # dado pessoal, fora do git (ver CURRICULO.md)
  skills: config/skills.yaml
  # "nenhum" = tudo determinístico, sem custo e sem IA (padrão). "claude-cli"
  # usa o Claude Code local pra reescrever os bullets — toda saída passa pelo
  # guardrail anti-invenção, e o que não passa volta pro texto original.
  provedor: nenhum
  timeout_ia: 60.0
  # o mestre não existe no runner do GitHub Actions. Pra ter score no Telegram
  # também por lá, liste aqui só as skills canônicas — sem nome, contato nem
  # histórico. Vazio = sem pontuação no Actions (só localmente).
  skills_perfil: []

# corta a notificação de vagas abaixo desse score (0-100); null = notifica
# tudo. Sem fonte de pontuação o corte é ignorado, pra não engolir vaga.
# Atenção: vaga barrada aqui já conta como vista — baixar o corte depois não
# a traz de volta.
aderencia_minima: null
