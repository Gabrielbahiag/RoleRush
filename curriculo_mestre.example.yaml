# Exemplo FICTÍCIO de currículo-mestre.
#
# Este arquivo é versionado de propósito: documenta o formato e alimenta os
# testes. O currículo real vive em `curriculo_mestre.yaml`, que está no
# .gitignore e nunca entra no repositório (ver CURRICULO.md, premissa 4).
#
# Regras do formato:
#   - todo bullet tem `id` único no currículo INTEIRO (experiências +
#     projetos). É o id que amarra qualquer reescrita por IA à experiência
#     real — é o que o guardrail anti-invenção verifica.
#   - textos são bilíngues (pt/en): o idioma do currículo gerado segue o
#     idioma da vaga.
#   - `tags` são as skills que aquele bullet comprova; é por elas que a
#     seleção ranqueia o que entra no currículo adaptado.

