name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependências
        # --extra dev: pytest e respx estão em optional-dependencies, que o
        # uv sync não instala sozinho. Sem isso o passo abaixo nem acha o pytest.
        run: uv sync --frozen --extra dev

      - name: Rodar testes
        run: uv run pytest
