# Abre PRs mensais atualizando as actions (fixadas por SHA nos workflows) e
# as dependências Python do uv.lock. Os PRs rodam o workflow de testes antes
# de qualquer merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      dependencias:
        patterns: ["*"]
